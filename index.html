<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>GoalData</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <div class="logo">Goal<span>Data</span> ⚽</div>
    <div class="clock" id="clock">Loading time...</div>
  </header>

  <div class="nav">

    <button class="active" onclick="showPage('home', this)">
      Today
    </button>

    <button onclick="showPage('live', this)">
      🔴 Live
    </button>

    <button onclick="showPage('upcoming', this)">
      Upcoming
    </button>

    <button onclick="showPage('leagues', this)">
      Leagues
    </button>

    <button onclick="showPage('data', this)">
      📶 Data
    </button>

  </div>


  <main class="container">

    <!-- HOME -->

    <section id="home">

      <input
        class="search"
        id="search"
        oninput="searchMatches()"
        placeholder="🔎 Search team or league..."
      >

      <div class="section-title">

        <h2>Today's Matches</h2>

        <span class="time" id="date"></span>

      </div>

      <div id="matches"></div>

    </section>


    <!-- LIVE -->

    <section id="live" class="hidden">

      <div class="section-title">

        <h2>🔴 Live Matches</h2>

      </div>

      <div id="liveMatches"></div>

    </section>


    <!-- UPCOMING -->

    <section id="upcoming" class="hidden">

      <div class="section-title">

        <h2>Upcoming Matches</h2>

      </div>

      <div id="upcomingMatches"></div>

    </section>


    <!-- LEAGUES -->

    <section id="leagues" class="hidden">

      <div class="section-title">

        <h2>🌍 Football Leagues</h2>

      </div>

      <div class="leagues" id="leagueList"></div>

    </section>


    <!-- DATA -->

    <section id="data" class="hidden">

      <div class="section-title">

        <h2>📶 Buy Data</h2>

      </div>


      <div class="data-box">

        <p>
          <b>Choose Network</b>
        </p>


        <div class="network">

          <button
            class="selected"
            onclick="network(this)"
          >
            MTN
          </button>

          <button onclick="network(this)">
            Airtel
          </button>

          <button onclick="network(this)">
            Glo
          </button>

          <button onclick="network(this)">
            9mobile
          </button>

        </div>


        <div class="data-option">

          <span>1GB Data</span>

          <b>₦500</b>

          <button
            class="buy"
            onclick="buyData('1GB')"
          >
            Buy
          </button>

        </div>


        <div class="data-option">

          <span>2GB Data</span>

          <b>₦1,000</b>

          <button
            class="buy"
            onclick="buyData('2GB')"
          >
            Buy
          </button>

        </div>


        <div class="data-option">

          <span>5GB Data</span>

          <b>₦2,000</b>

          <button
            class="buy"
            onclick="buyData('5GB')"
          >
            Buy
          </button>

        </div>


        <p style="margin-top:15px;font-size:12px;color:#777">

          Payment and automatic data delivery
          will be connected in the next stage.

        </p>

      </div>

    </section>

  </main>


  <!-- BOTTOM NAVIGATION -->

  <div class="bottom">

    <button onclick="showPage('home')">

      <span>🏠</span>

      Home

    </button>


    <button onclick="showPage('live')">

      <span>⚽</span>

      Live

    </button>


    <button onclick="showPage('leagues')">

      <span>🏆</span>

      Leagues

    </button>


    <button onclick="showPage('data')">

      <span>📶</span>

      Data

    </button>

  </div>


  <!-- JAVASCRIPT -->

  <script src="app.js"></script>

</body>
</html>
